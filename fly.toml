# fly.toml app configuration file generated for whale-bot on 2026-05-28T23:49:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'whale-bot'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'

[[mounts]]
  source = 'whale_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
