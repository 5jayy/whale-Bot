# fly.toml app configuration file generated for whale-bot-falling-tree-6786 on 2026-05-28T19:56:22-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "whale-bot-3ssvtw"
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'

[[mounts]]
  source = 'whale_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[experimental]
  enable_consul = false

[dns]
  nameservers = ["8.8.8.8", "1.1.1.1"]
